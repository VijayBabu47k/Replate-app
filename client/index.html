<!doctype html>
<html lang="en" data-theme="dark" style="background:#060907;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#060907" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the theme before first paint (saved choice, else OS preference) to avoid a flash
      (function () {
        try {
          var s = localStorage.getItem('rts-theme');
          var m = s === 'light' || s === 'dark' ? s : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          var d = document.documentElement;
          d.setAttribute('data-theme', m);
          d.style.colorScheme = m;
          d.style.background = m === 'light' ? '#f4f7f5' : '#060907';
        } catch (e) {}
      })();
    </script>
